<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Event Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>✨ Smart Event Dashboard</h1>

  <form id="eventForm" class="glass">
    <input type="text" id="title" placeholder="Event Name" required>
    <input type="date" id="date" required>
    <textarea id="desc" placeholder="Event Description"></textarea>
    <button type="submit">Add Event</button>
  </form>

  <div class="top-bar">
    <div class="stat glass">
      📅 Total Events <span id="counter">0</span>
    </div>
  </div>

  <div id="events"></div>

</div>

<script src="script.js"></script>
</body>
</html>
